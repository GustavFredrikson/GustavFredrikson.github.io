name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: [README.md, CLAUDE.md, 'tools/**', '.claude/**']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  # Single job: build and deploy on one runner to skip a second runner startup.
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      # Bun installs from package-lock.json (still the source of truth; local dev
      # uses npm) and runs the build. Benchmarked ~4s faster than npm, same dist.
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('package-lock.json') }}
      - run: bun install
      - run: bun --bun run build
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
        with: { reporting_interval: 1000 }
