<!doctype html>
<!--
  Source for the stacked-guardrails cover image: effective layers for the 45 pairs
  of guards of the same kind (injection + injection, harm + harm) and of mixed kinds
  (harm guard + injection classifier). Values are n_eff from the study's
  pairs_neff.csv (also in tools/figures/stacked-guardrails.json); the window chrome
  is made up. Re-render both themes with: tools/covers/render.sh stacked-guardrails
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --backdrop: #e9e9e6;
    --shadow: 0 1px 2px rgba(20,20,20,.08), 0 18px 40px -8px rgba(20,20,20,.28), 0 50px 90px -30px rgba(20,20,20,.35);
    --win: #fbfbfa;
    --bar: #ededeb;
    --border: #d3d3d0;
    --fg: #242422;
    --muted: #6d6d68;
    --light: #c9c9c5;
    --grid: #e4e4e1;
    --same: #9a9a94;
    --mixed: #257de0;
  }
  :root.dark {
    --backdrop: #1b1b19;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -8px rgba(0,0,0,.55), 0 50px 90px -30px rgba(0,0,0,.6);
    --win: #22221f;
    --bar: #2a2a27;
    --border: #3a3a36;
    --fg: #e4e4df;
    --muted: #96968f;
    --light: #4a4a46;
    --grid: #30302c;
    --same: #77776f;
    --mixed: #338ced;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1120px; height: 840px; overflow: hidden; background: var(--backdrop); }
  .win {
    position: absolute; left: 72px; top: 68px; width: 1180px; height: 900px;
    background: var(--win); border-radius: 12px; overflow: hidden;
    box-shadow: var(--shadow), 0 0 0 1px var(--border);
    font: 400 17px/1.5 'IBM Plex Sans', -apple-system, system-ui, sans-serif; color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  .bar {
    height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
    background: var(--bar); border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted);
  }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--light); }
  .bar span { margin-left: 18px; font-weight: 500; }
  .body { padding: 44px 48px; }
  h2 { font: 600 15px/1 'IBM Plex Sans', sans-serif; letter-spacing: .01em; }
  .sub { margin-top: 10px; font: 400 13px/1.4 'IBM Plex Mono', monospace; color: var(--muted); }
  svg { display: block; margin-top: 34px; overflow: visible; }
  svg text { font-family: 'IBM Plex Mono', monospace; fill: var(--muted); font-size: 13px; }
  svg .big { font: 500 46px/1 'IBM Plex Sans', sans-serif; fill: var(--fg); letter-spacing: -.02em; }
  svg .row { font: 500 12px/1 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: .06em; }
  svg .grid { stroke: var(--grid); }
  svg .ref { stroke: var(--muted); stroke-dasharray: 4 4; }
  svg .same { fill: var(--same); }
  svg .mixed { fill: var(--mixed); }
  svg circle { stroke: var(--win); stroke-width: 2.5; }
  svg .med { stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
</style>
<script>
  if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.classList.add('dark');
</script>
</head>
<body>
<div class="win">
  <div class="bar"><i></i><i></i><i></i><span>stacked guardrails — 11 guards, 55 pairs</span></div>
  <div class="body">
    <h2>Effective layers per pair of guards</h2>
    <p class="sub">2.0 = the pair fails like two independent guards</p>
    <svg id="chart" width="900" height="560"></svg>
  </div>
</div>
<script>
  const rows = [
    { label: 'same kind · injection + injection, harm + harm', cls: 'same', med: 1.49,
      v: [1.16, 1.21, 1.26, 1.36, 1.36, 1.42, 1.45, 1.47, 1.49, 1.49, 1.51, 1.53, 1.6, 1.62, 1.69, 1.44, 1.54, 1.62, 1.78, 1.79, 1.8] },
    { label: 'mixed kinds · harm guard + injection classifier', cls: 'mixed', med: 2.41,
      v: [1.87, 1.9, 1.94, 2.04, 2.08, 2.14, 2.16, 2.19, 2.22, 2.36, 2.37, 2.37, 2.44, 2.47, 2.5, 2.51, 2.54, 2.55, 2.61, 2.62, 2.63, 2.64, 2.7, 2.95] },
  ];
  const svg = document.getElementById('chart'), NS = 'http://www.w3.org/2000/svg';
  const el = (n, a, t) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (t) e.textContent = t; svg.appendChild(e); return e; };
  const L = 10, R = 890, X = v => L + (v - 1) / 2 * (R - L);
  for (const v of [1, 1.5, 2, 2.5, 3]) {
    el('line', { x1: X(v), x2: X(v), y1: 10, y2: 470, class: v === 2 ? 'ref' : 'grid' });
    el('text', { x: X(v), y: 500, 'text-anchor': v === 1 ? 'start' : v === 3 ? 'end' : 'middle' }, v.toFixed(1));
  }
  rows.forEach((r, i) => {
    const y0 = 40 + i * 220, yc = y0 + 130;
    el('text', { x: L, y: y0, class: 'row' }, r.label);
    const placed = [];
    for (const v of [...r.v].sort((a, b) => a - b)) {
      const x = X(v); let dy = 0, s = 0;
      while (placed.some(([px, pdy]) => Math.abs(x - px) < 17 && Math.abs(dy - pdy) < 17)) { s++; dy = Math.ceil(s / 2) * 16 * (s % 2 ? 1 : -1); }
      placed.push([x, dy]);
      el('circle', { cx: x, cy: yc + dy, r: 9, class: r.cls });
    }
    el('line', { x1: X(r.med), x2: X(r.med), y1: yc - 48, y2: yc + 48, class: 'med' });
    el('text', { x: X(r.med) - 12, y: yc - 62, class: 'big', 'text-anchor': 'end' }, r.med.toFixed(2));
  });
</script>
</body>
</html>
