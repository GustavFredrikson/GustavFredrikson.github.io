# Open-source contributions, listed on the home page newest first.
# Add one entry per contribution; the key is just a unique id.
#
#   project:     project name as shown
#   description: one sentence, what was contributed
#   status:      e.g. Merged upstream, Accepted, Published
#   area:        language and/or field
#   date:        YYYY-MM (or YYYY-MM-DD)
#   url:         strongest public source: merged PR, commit, issue, release or project page
#   linkLabel:   optional; link text is derived from GitHub URLs, set this for anything else
#   writeup:     optional path to a longer write-up on this site

